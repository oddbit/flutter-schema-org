name: schema_org
description: >-
  JSON-LD Flutter/Dart classes for the full Schema.org vocabulary, generated
  from the official schema distribution. Emit structured data from Flutter
  web apps with type-safe constructors, or serialize to a JSON-LD string on
  any target with `SchemaOrg.toJsonLdString`.
version: 2.1.0
homepage: https://oddb.it/website
repository: https://github.com/oddbit/flutter-schema-org
issue_tracker: https://github.com/oddbit/flutter-schema-org/issues

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
